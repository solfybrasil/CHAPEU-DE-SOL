<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Preview de Fotos - Camping Chapéu de Sol</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
    h1, h2 { color: #f5f0eb; border-bottom: 1px solid #444; padding-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: #2a2a2a; border-radius: 8px; overflow: hidden; border: 1px solid #444; }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .card .info { padding: 10px; font-size: 13px; }
    .card .name { font-weight: bold; color: #e8c37d; margin-bottom: 4px; word-break: break-all; }
    .card .dims { color: #aaa; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Catálogo Geral de Fotos Baixadas</h1>
  <div id="content"></div>

  <script>
    async function load() {
      const res = await fetch('/_fotos_data.json');
      const data = await res.json();
      const container = document.getElementById('content');
      
      for (const section in data) {
        const h2 = document.createElement('h2');
        h2.textContent = section + ' (' + data[section].length + ' fotos)';
        container.appendChild(h2);
        
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const item of data[section]) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${item.src}" loading="lazy">
            <div class="info">
              <div class="name">${item.name}</div>
              <div class="dims">${item.dims} | ${(item.size / 1024).toFixed(0)} KB</div>
              <div style="color:#888; font-size:11px; word-break:break-all;">Origem: ${item.orig}</div>
            </div>
          `;
          grid.appendChild(card);
        }
        container.appendChild(grid);
      }
    }
    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospedagem — Camping Chapéu de Sol</title>
<meta name="description" content="Detalhes, fotos, estrutura e valores das hospedagens do Camping Chapéu de Sol em Itu-SP.">
<link rel="icon" type="image/png" href="/img/logo/favicon.png?v=2">
<meta property="og:title" content="Hospedagem — Camping Chapéu de Sol">
<meta property="og:description" content="Conheça nossa estrutura em meio à natureza com conforto e lazer completo.">
<meta property="og:image" content="/fotos/capa-site.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#0F3D2A; --panel:#164A33; --panel-2:#1B5539; --deep:#0B2F20;
    --cream:#EFE8D0; --cream-2:#F6F1E1; --ink:#10281C;
    --mint:#5FAE58; --sun:#F2B630;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Manrope",system-ui,sans-serif;background:var(--bg);color:var(--cream);-webkit-font-smoothing:antialiased;overflow-x:hidden;
    background-image:radial-gradient(1200px 600px at 80% -10%,rgba(78,154,104,.18),transparent 60%),radial-gradient(900px 500px at -10% 40%,rgba(0,0,0,.18),transparent 60%)}
  a{color:inherit;text-decoration:none}
  img{display:block}
  .page{width:min(1240px,94vw);margin:0 auto;padding:18px 0 40px;position:relative}
  .display{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:.88;text-transform:uppercase}
  .script{font-family:"Caveat",cursive;font-weight:500;color:rgba(239,232,208,.7)}
  .mint{color:var(--mint)}

  /* Frame */
  .ph{position:relative;overflow:hidden;background:linear-gradient(140deg,#2A6A47,#123B28);}
  .ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 14px)}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .ph:hover img{transform:scale(1.03)}

  .btn{display:inline-flex;align-items:center;gap:.7rem;border:0;border-radius:999px;cursor:pointer;font:inherit;font-weight:700;font-size:.82rem;padding:.55rem .6rem .55rem 1.1rem;transition:transform .2s, filter .2s;white-space:nowrap;text-decoration:none}
  .btn:hover{transform:translateY(-2px)}
  .btn .ar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.9rem}
  .btn-dark{background:var(--deep);color:var(--cream)}
  .btn-dark .ar{background:var(--cream);color:var(--deep)}
  .btn-cream{background:var(--cream);color:var(--ink)}
  .btn-cream .ar{background:var(--deep);color:var(--cream)}
  .btn-mint{background:var(--mint);color:#fff}
  .btn-mint .ar{background:rgba(255,255,255,.2);color:#fff}
  .btn-sm{padding:.45rem .9rem;font-size:.74rem}

  .pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--cream);color:var(--ink);border-radius:999px;padding:.4rem .85rem;font-size:.72rem;font-weight:700}
  .pill svg{width:13px;height:13px}
  .pill-dark{background:rgba(11,47,32,.75);color:var(--cream);border:1px solid rgba(239,232,208,.15)}

  /* NAV */
  .topnav{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:14px;background:var(--panel);border-radius:var(--r);padding:12px 20px}
  .nav-left{display:flex;align-items:center;gap:1.2rem}
  .nav-back{display:inline-flex;align-items:center;gap:.5rem;font-size:.82rem;font-weight:700;color:var(--cream);opacity:.9;transition:opacity .2s}
  .nav-back:hover{opacity:1;color:var(--sun)}
  .nav-back svg{width:16px;height:16px}
  .nav-brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:.9rem}
  .nav-brand img{height:28px;width:auto}
  .nav-links{display:flex;align-items:center;gap:1.5rem;font-size:.78rem;font-weight:600;opacity:.85}
  .nav-links a:hover{opacity:1;color:#fff}

  /* HERO */
  .hosp-hero{display:grid;grid-template-columns:1.05fr 1fr;gap:12px}
  .hosp-left{background:var(--panel);border-radius:var(--r);padding:24px 28px;display:flex;flex-direction:column;position:relative}
  .hosp-badge-row{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
  .hosp-badge{background:var(--panel-2);color:var(--sun);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:.35rem .75rem;border-radius:6px;border:1px solid rgba(242,182,48,.25)}
  .status-badge{font-size:.68rem;font-weight:800;padding:.35rem .75rem;border-radius:6px;text-transform:uppercase}
  .status-badge.esgotado{background:#7a1d1d;color:#ffcaca}
  .status-badge.em-breve{background:#533812;color:#fce49e}
  .hosp-title{font-size:clamp(3.2rem,6vw,5.2rem);line-height:.88;margin-bottom:.4rem}
  .hosp-slogan{font-size:1.6rem;line-height:1.1;color:var(--cream);opacity:.85;margin-bottom:1.2rem}
  .hosp-desc{font-size:.85rem;line-height:1.55;opacity:.85;margin-bottom:1.4rem;max-width:55ch}
  
  .chips-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.8rem}
  .chip{background:var(--cream);color:var(--ink);border-radius:8px;padding:.4rem .75rem;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;gap:.4rem}
  .chip svg{width:14px;height:14px;opacity:.7}
  
  .hosp-pricing{margin-top:auto;padding-top:1.5rem;border-top:1px solid rgba(239,232,208,.12);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
  .price-col small{display:block;font-size:.68rem;opacity:.6;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .price-col .val{font-family:"Bebas Neue";font-size:2.8rem;line-height:.9;color:var(--sun)}
  .price-col .unit{font-size:.82rem;font-weight:700;opacity:.8;margin-left:4px}

  /* HERO RIGHT / GALLERY */
  .hosp-right{display:flex;flex-direction:column;gap:10px}
  .main-photo-wrap{border-radius:var(--r);height:420px;position:relative;cursor:pointer;overflow:hidden}
  .main-photo-wrap .ph{width:100%;height:100%}
  .photo-overlay-tag{position:absolute;top:14px;right:14px;background:rgba(11,47,32,.85);backdrop-filter:blur(6px);padding:.4rem .85rem;border-radius:999px;font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:.4rem;z-index:2}
  .photo-overlay-tag svg{width:13px;height:13px}
  .photo-counter{position:absolute;bottom:14px;left:14px;background:rgba(11,47,32,.85);backdrop-filter:blur(6px);padding:.35rem .75rem;border-radius:6px;font-size:.72rem;font-weight:700;z-index:2}
  .hosp-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .hosp-thumb{aspect-ratio:4/3;border-radius:8px;cursor:pointer;outline:2px solid transparent;outline-offset:2px;transition:all .2s;overflow:hidden}
  .hosp-thumb.on{outline-color:var(--sun)}
  .hosp-thumb-more{background:var(--panel);display:grid;place-items:center;border-radius:8px;font-weight:800;font-size:.78rem;cursor:pointer;border:1px solid rgba(239,232,208,.2)}
  .hosp-thumb-more:hover{background:var(--panel-2);color:var(--sun)}

  /* BOOKING BAR */
  .book{margin-top:12px;background:var(--cream);color:var(--ink);border-radius:var(--r);padding:14px 14px 14px 24px;display:grid;grid-template-columns:auto 1.3fr 1fr 1fr 1fr auto;gap:10px;align-items:center}
  .book h4{font-family:"Bebas Neue";font-size:1.35rem;line-height:.9;font-weight:400;letter-spacing:.02em;margin-right:.6rem}
  .bf{background:var(--cream-2);border:1px solid rgba(16,40,28,.12);border-radius:10px;padding:.45rem .75rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;position:relative}
  .bf small{display:block;font-size:.6rem;opacity:.55;font-weight:600}
  .bf input,.bf select{border:0;background:transparent;font:inherit;font-size:.78rem;font-weight:700;color:var(--ink);outline:none;width:100%;appearance:none;-webkit-appearance:none;cursor:pointer}
  .bf svg{width:16px;height:16px;opacity:.6;flex-shrink:0}
  .book .btn{padding:.85rem 1.4rem;font-size:.78rem}

  /* SECTIONS */
  section{position:relative;margin-top:clamp(3.5rem,7vw,5.5rem)}
  .sh{display:grid;grid-template-columns:150px 1fr auto;gap:1.5rem;align-items:end;margin-bottom:1.5rem}
  .sh .script{font-size:1.15rem;line-height:1;padding-bottom:.4rem}
  .sh h2{font-size:clamp(2.4rem,4.8vw,4rem)}
  
  /* ESTRUTURA */
  .struct-card{background:var(--cream);color:var(--ink);border-radius:var(--r);padding:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
  .struct-group h4{font-family:"Bebas Neue";font-size:1.5rem;letter-spacing:.02em;color:var(--bg);margin-bottom:.8rem;padding-bottom:.3rem;border-bottom:2px solid rgba(15,61,42,.15)}
  .struct-list{list-style:none;display:flex;flex-direction:column;gap:.55rem}
  .struct-list li{display:flex;align-items:flex-start;gap:.6rem;font-size:.82rem;font-weight:600;line-height:1.4}
  .struct-list li svg{width:15px;height:15px;color:var(--mint);flex-shrink:0;margin-top:2px}

  /* INCLUSO E LEVAR */
  .two-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .box-card{background:var(--panel);border-radius:var(--r);padding:28px;border:1px solid rgba(239,232,208,.08)}
  .box-card h3{font-family:"Bebas Neue";font-size:1.8rem;letter-spacing:.02em;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
  .box-card h3 svg{width:22px;height:22px}
  .box-list{list-style:none;display:flex;flex-direction:column;gap:.7rem}
  .box-list li{display:flex;align-items:flex-start;gap:.65rem;font-size:.84rem;font-weight:600;line-height:1.45;opacity:.9}
  .box-list li svg{width:17px;height:17px;flex-shrink:0;margin-top:2px}

  /* TABELAS PRECO CAROUSEL */
  .tabelas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .tabela-card{background:var(--panel);border-radius:var(--r);overflow:hidden;border:1px solid rgba(239,232,208,.1);cursor:pointer;transition:transform .2s}
  .tabela-card:hover{transform:translateY(-4px)}
  .tabela-card .ph{aspect-ratio:4/5}
  .tabela-card .caption{padding:.8rem 1rem;font-size:.78rem;font-weight:700;text-align:center;color:var(--cream)}
  .tabela-note{margin-top:12px;font-size:.78rem;opacity:.7;font-style:italic}

  /* FAQ / ACCORDION */
  .faq-card{background:var(--panel);border-radius:var(--r);padding:18px 24px;border:1px solid rgba(239,232,208,.08)}
  .faq-item{border-bottom:1px solid rgba(239,232,208,.1);padding:16px 0}
  .faq-item:last-child{border-bottom:0}
  .faq-q{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:700;font-size:.92rem}
  .faq-q:hover{color:var(--sun)}
  .faq-icon{width:24px;height:24px;border-radius:50%;background:rgba(239,232,208,.1);display:grid;place-items:center;font-size:1.1rem;transition:transform .3s}
  .faq-item.open .faq-icon{transform:rotate(45deg);background:var(--sun);color:var(--ink)}
  .faq-a{display:none;margin-top:.8rem;font-size:.82rem;line-height:1.55;opacity:.85;max-width:70ch}
  .faq-item.open .faq-a{display:block}

  /* OPCIONAIS PAGOS */
  .opc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .opc-card{background:var(--cream);color:var(--ink);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;justify-content:space-between}
  .opc-card h4{font-family:"Bebas Neue";font-size:1.5rem;margin-bottom:.4rem}
  .opc-card p{font-size:.8rem;opacity:.8;line-height:1.45;margin-bottom:1.2rem}

  /* OUTRAS HOSPEDAGENS CAROUSEL */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .h-card{background:var(--cream);color:var(--ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s;text-decoration:none}
  .h-card:hover{transform:translateY(-4px)}
  .h-card .ph{height:180px}
  .h-card .body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
  .h-card h3{font-family:"Bebas Neue";font-size:1.7rem;line-height:1;margin-bottom:.3rem}
  .h-card p{font-size:.76rem;line-height:1.45;opacity:.78;margin-bottom:1rem;flex:1}
  .h-card .bot{display:flex;align-items:center;justify-content:space-between;padding-top:.8rem;border-top:1px solid rgba(16,40,28,.1)}
  .h-card .price{font-family:"Bebas Neue";font-size:1.6rem;color:var(--bg);line-height:1}

  /* FOOTER */
  footer{margin-top:clamp(5rem,9vw,7rem);padding-top:2.5rem;border-top:1px solid rgba(239,232,208,.15);display:flex;flex-direction:column;gap:1.5rem}
  .foot-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.5rem}
  .foot-logo{height:36px;width:auto}
  .foot-text{font-size:.78rem;opacity:.7}

  /* LIGHTBOX */
  .lightbox{position:fixed;inset:0;background:rgba(6,24,16,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:99999;display:none;align-items:center;justify-content:center;touch-action:none}
  .lightbox.active{display:flex}
  .lb-top{position:absolute;top:max(16px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .lb-counter{color:var(--cream);font-size:.88rem;font-weight:700;background:rgba(11,47,32,.75);padding:.35rem .75rem;border-radius:999px;border:1px solid rgba(239,232,208,.2)}
  .lb-close{background:rgba(11,47,32,.75);border:1px solid rgba(239,232,208,.2);color:var(--cream);font-size:1.8rem;line-height:1;width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:background .2s,transform .2s}
  .lb-close:hover,.lb-close:active{background:var(--mint);color:#fff;transform:scale(1.05)}
  .lb-content{width:100%;height:100%;max-width:96vw;max-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 10px 20px;position:relative;user-select:none;-webkit-user-select:none}
  .lb-content img{max-width:100%;max-height:calc(86vh - 40px);object-fit:contain;border-radius:12px;box-shadow:0 16px 50px rgba(0,0,0,.6);transition:transform .25s ease}
  .lb-caption{margin-top:10px;color:var(--cream);font-size:.82rem;font-weight:600;text-align:center;max-width:80vw}
  .lb-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(11,47,32,.8);border:1px solid rgba(239,232,208,.25);color:var(--cream);font-size:1.4rem;width:48px;height:48px;border-radius:50%;cursor:pointer;display:grid;place-items:center;z-index:10;transition:background .2s,transform .2s}
  .lb-arrow.lb-prev, .lb-arrow.prev{left:14px!important;right:auto!important}
  .lb-arrow.lb-next, .lb-arrow.next{right:14px!important;left:auto!important}
  .lb-arrow:hover,.lb-arrow:active{background:var(--mint);color:#fff}
  @media(max-width:640px){
    .lb-arrow{width:42px;height:42px;font-size:1.2rem}
    .lb-arrow.lb-prev, .lb-arrow.prev{left:8px!important;right:auto!important}
    .lb-arrow.lb-next, .lb-arrow.next{right:8px!important;left:auto!important}
  }

  /* MOBILE FIXED BOTTOM BAR */
  .mobile-bottom-bar{display:none !important}
  .mob-price{font-size:.78rem}
  .mob-price b{font-family:"Bebas Neue";font-size:1.6rem;color:var(--sun);margin-left:4px}
  .mobile-bottom-bar .btn{padding:.65rem 1.4rem;font-size:.82rem}

  /* 404 NOT FOUND */
  .not-found{text-align:center;padding:80px 20px;background:var(--panel);border-radius:var(--r);margin:40px auto;max-width:600px}
  .not-found h2{font-size:3rem;margin-bottom:1rem}
  .not-found p{font-size:.9rem;opacity:.8;margin-bottom:2rem}

  @media(max-width:960px){
    .hosp-hero{grid-template-columns:1fr}
    .two-cols{grid-template-columns:1fr}
    .book{grid-template-columns:1fr 1fr;padding:16px}
    .book h4{grid-column:span 2}
    .book .btn{grid-column:span 2}
    .sh{grid-template-columns:1fr;gap:.5rem}
    .sh .script{display:none}
  }

  @media(max-width:640px){
    .hosp-thumbs{grid-template-columns:repeat(4,1fr)}
    .main-photo-wrap{height:280px}
    .book{grid-template-columns:1fr}
    .book h4{grid-column:span 1}
    .book .btn{grid-column:span 1}
    .mobile-bottom-bar{display:none !important}
    .page{padding-bottom:80px}
    .lb-arrow.prev{left:8px;width:40px;height:40px;font-size:1.3rem}
    .lb-arrow.next{right:8px;width:40px;height:40px;font-size:1.3rem}
  }



/* =====================================================================
   MOBILE (≤ 760px) — versão celular estilo app
   ===================================================================== */
html, body {
  overflow-x: clip !important;
  max-width: 100% !important;
}
.tabbar { display: none !important; }
.dots { display: none; }

@media(max-width: 760px) {
  :root { --r: 18px; }
  body { font-size: 15px; }
  .page {
    width: auto;
    max-width: 100% !important;
    overflow-x: clip;
    padding: 0 16px calc(96px + env(safe-area-inset-bottom));
  }
  section { margin-top: 2.8rem; }

  /* Hide old mobile bar and floating wa */
  .mobile-bottom-bar, .wa { display: none !important; }

  /* Topnav */
  .topnav { padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); }
  .nav-brand span { display: none; }

  /* Hero */
  .hosp-hero { grid-template-columns: 1fr; gap: 1.5rem; }
  .hosp-title { font-size: 2.6rem; line-height: .95; }
  .hosp-pricing { flex-direction: column; align-items: stretch; gap: 1rem; }
  .hosp-pricing .btn { justify-content: center; min-height: 48px; }

  /* Booking bar */
  .book {
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 14px;
    border-radius: 18px;
    box-shadow: 0 18px 40px -18px rgba(0,0,0,.55);
  }
  .book h4 { font-size: 1.3rem; }
  .bf { min-height: 48px; border-radius: 10px; padding: .55rem .7rem; }
  .bf input, .bf select { font-size: .88rem; width: 100%; min-width: 0; }
  .book .btn { min-height: 48px; justify-content: center; }

  /* Sections */
  .two-cols { grid-template-columns: 1fr; gap: 12px; }
  .tabelas-grid { grid-template-columns: 1fr; }
  .outras-grid {
    margin: 0 -16px;
    padding: 0 16px 4px;
    scroll-padding: 0 16px;
    gap: 12px;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 80%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .outras-grid::-webkit-scrollbar { display: none; }
  .outras-grid .card { scroll-snap-align: start; }

  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .dots i { width: 6px; height: 6px; border-radius: 999px; background: rgba(239,232,208,.28); transition: width .3s, background .3s; }
  .dots i.on { width: 20px; background: #A8D8A2; }

  /* Footer */
  footer { padding: 2rem 1.4rem; text-align: center; }
  .foot-row { flex-direction: column; align-items: center; text-align: center; gap: 1rem; }

  /* Barra inferior estilo app (oculta na aba da hospedagem) */
  .tabbar { display: none !important;
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 80;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: end;
    background: rgba(11, 47, 32, .92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(239, 232, 208, .1);
    border-radius: 22px;
    padding: 8px 4px 7px;
    box-shadow: 0 14px 40px -12px rgba(0, 0, 0, .6);
  }
  .tabbar a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: .62rem;
    font-weight: 700;
    color: rgba(239, 232, 208, .62);
    min-height: 44px;
    justify-content: flex-end;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }
  .tabbar a svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tabbar a.on { color: #A8D8A2; }
  .tb-cta i {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    margin-top: -26px;
    border-radius: 50%;

<body>

<div class="page" id="pageContainer">
  <div style="text-align:center;padding:6rem 1rem;color:var(--cream);opacity:.7">
    Carregando detalhes da hospedagem...
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de fotos">
  <div class="lb-top">
    <div class="lb-counter" id="lbCounter">1 / 1</div>
    <button type="button" class="lb-close" id="lbClose" onclick="closeLightbox()" aria-label="Fechar">&times;</button>
  </div>
  <button type="button" class="lb-arrow lb-prev prev" id="lbPrev" onclick="prevLb(event)" aria-label="Foto anterior">&#10094;</button>
  <div class="lb-content" id="lbContent">
    <img id="lbImg" src="" alt="Foto ampliada">
    <div class="lb-caption" id="lbCaption"></div>
  </div>
  <button type="button" class="lb-arrow lb-next next" id="lbNext" onclick="nextLb(event)" aria-label="Próxima foto">&#10095;</button>
</div>

<script>

let siteDados = null;
let currentHosp = null;
let currentPhotos = [];
let currentLbIndex = 0;

function getSlugFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const qSlug = params.get('slug');
  if (qSlug) return qSlug;
  
  const path = window.location.pathname;
  const match = path.match(/\/hospedagens\/([^/?#]+)/);
  if (match && match[1]) return match[1];
  return "";
}

function normalizeSlug(slug) {
  if (slug === "barraca") return "area-barracas";
  if (slug === "area-barracas") return "area-barracas";
  return slug;
}

function openLightbox(photos, startIndex = 0) {
  if (!photos || !photos.length) return;
  currentPhotos = photos;
  currentLbIndex = Math.max(0, Math.min(startIndex, photos.length - 1));
  updateLightbox();
  const lb = document.getElementById('lightbox');
  if (lb) lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(e) {
  if (e) e.stopPropagation();
  const lb = document.getElementById('lightbox');
  if (lb) lb.classList.remove('active');
  document.body.style.overflow = '';
}

function updateLightbox() {
  if (!currentPhotos || !currentPhotos.length) return;
  const item = currentPhotos[currentLbIndex];
  const src = typeof item === 'string' ? item : (item.foto || item.src || '');
  const caption = typeof item === 'string' ? '' : (item.legenda || item.descricao || '');
  
  const img = document.getElementById('lbImg');
  if (img) {
    img.src = src;
    img.alt = caption || 'Foto ampliada';
  }
  
  const counter = document.getElementById('lbCounter');
  if (counter) {
    counter.textContent = `${currentLbIndex + 1} / ${currentPhotos.length}`;
  }
  const cap = document.getElementById('lbCaption');
  if (cap) {
    cap.textContent = caption;
    cap.style.display = caption ? 'block' : 'none';
  }
}

function nextLb(e) {
  if (e) e.stopPropagation();
  if (!currentPhotos || !currentPhotos.length) return;
  currentLbIndex = (currentLbIndex + 1) % currentPhotos.length;
  updateLightbox();
}

function prevLb(e) {
  if (e) e.stopPropagation();
  if (!currentPhotos || !currentPhotos.length) return;
  currentLbIndex = (currentLbIndex - 1 + currentPhotos.length) % currentPhotos.length;
  updateLightbox();
}

// Lightbox keyboard & swipe events
window.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox');
  if (!lb || !lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') nextLb();
  if (e.key === 'ArrowLeft') prevLb();
});

// Touch swipe gestures on mobile
let touchStartX = 0, touchStartY = 0;
const lbContainer = document.getElementById('lightbox');
if (lbContainer) {
  lbContainer.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  lbContainer.addEventListener('touchend', e => {
    const diffX = touchStartX - e.changedTouches[0].screenX;
    const diffY = touchStartY - e.changedTouches[0].screenY;
    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
      if (diffX > 0) nextLb();
      else prevLb();
    }
  }, { passive: true });
}

// WhatsApp helper
function buildWhatsAppUrl(hospNome, checkin = '', checkout = '', hospedes = '') {
  const zap = siteDados && siteDados.contato && siteDados.contato.whatsapp ? siteDados.contato.whatsapp : '5511974148419';
  let msg = `Olá! Tenho interesse na hospedagem *${hospNome}* no Camping Chapéu de Sol.`;
  if (checkin && checkout) msg += ` Período: ${checkin} a ${checkout}.`;
  if (hospedes) msg += ` Hóspedes: ${hospedes}.`;
  msg += ` Poderia me informar a disponibilidade e valores?`;
  return `https://wa.me/${zap}?text=${encodeURIComponent(msg)}`;
}

function renderNotFound() {
  const container = document.getElementById('pageContainer');
  container.innerHTML = `
    <header class="topnav">
      <div class="nav-left">
        <a href="/#hospedagens" class="nav-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Todas as hospedagens
        </a>
      </div>
      <a href="/" class="nav-brand">
        <img src="/img/logo/arvore.png" alt="Chapéu de Sol">
        <span>Camping Chapéu de Sol</span>
      </a>
    </header>
    <div class="not-found">
      <h2 class="display">Hospedagem não encontrada</h2>
      <p>A acomodação que você procura não foi localizada ou o link pode estar incorreto.</p>
      <a href="/#hospedagens" class="btn btn-cream">
        Ver todas as acomodações
        <span class="ar">→</span>
      </a>
    </div>
  `;
}

function renderPage(h, dados) {
  currentHosp = h;
  const isGlamping = h.slug === 'glamping' || h.status === 'em-breve';
  const isEsgotado = h.status === 'esgotado';
  const fotos = h.fotos && h.fotos.length ? h.fotos : ['/fotos/capa-site.jpg'];
  const capaFoto = fotos[0];
  const tabelas = h.tabelasPreco || [];
  const regrasGerais = dados.regrasGerais || {};

  // Update SEO
  document.title = `${h.nome} — Camping Chapéu de Sol`;
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = h.descricao || `${h.nome} no Camping Chapéu de Sol. Lazer completo, contato com a natureza e conforto.`;
  const ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) ogTitle.content = `${h.nome} — Camping Chapéu de Sol`;
  const ogDesc = document.querySelector('meta[property="og:description"]');
  if (ogDesc) ogDesc.content = h.slogan || h.descricao || '';
  const ogImg = document.querySelector('meta[property="og:image"]');
  if (ogImg) ogImg.content = window.location.origin + capaFoto;

  const zapUrl = buildWhatsAppUrl(h.nome);

  // Chips HTML
  const chipsHtml = [];
  if (h.refeicoesInclusas) chipsHtml.push(`<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>${h.refeicoesInclusas}</span>`);
  if (h.capacidade && h.capacidade !== 'Não informado') chipsHtml.push(`<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>${h.capacidade}</span>`);

/* ===================== RESERVA HOSPEDAGEM ===================== */
let TAXA_PET = 50;
let FERIADOS = {};
const MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const SEM = ["dom","seg","ter","qua","qui","sex","sáb"];
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const day0 = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const nightsOf = (a, b) => Math.round((day0(b) - day0(a)) / 864e5);
const fmtS = d => `${SEM[d.getDay()]}, ${d.getDate()} ${MES[d.getMonth()].slice(0,3)}`;
const fmtBR = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const TODAY = day0(new Date());

const B = {
  acc: "",
  ci: addD(TODAY, 7),
  co: addD(TODAY, 9),
  ad: 2,
  cr: 0,
  pet: false,
  view: new Date(TODAY.getFullYear(), TODAY.getMonth(), 1),
  picking: "in",
  hover: null
};

let openPane = null;

function setupHospBooking(hosp, data) {
  if (data.taxaPet) TAXA_PET = data.taxaPet;
  else if (data.reserva && data.reserva.taxaPet) TAXA_PET = data.reserva.taxaPet;
  const feriadosList = data.feriados || (data.reserva && data.reserva.feriados) || [];
  FERIADOS = {};
  feriadosList.forEach(f => { if (f && f.data) FERIADOS[f.data] = f.nome; });

  B.acc = hosp.slug || hosp.id;
  const isDay = () => hosp.tipoReserva === "dia" || hosp.slug === "day-use";
  const isGlamping = () => hosp.status === "em_breve" || hosp.preco == null || hosp.slug === "glamping";
  const isPetOk = () => !!hosp.aceitaPet;

  const pop = document.getElementById("bpop"), back = document.getElementById("bback"), book = document.getElementById("reservar");
  if (!pop || !book) return;

  function openP(pane, btn) {
    openPane = pane; pop.dataset.show = pane; pop.classList.add("open"); back.classList.add("open");
    document.querySelectorAll(".bf").forEach(b => b.classList.toggle("on", b === btn));
    if (innerWidth > 760) {
      const w = pop.offsetWidth, max = book.clientWidth - w - 8;
      pop.style.left = Math.max(8, Math.min(btn.offsetLeft, max)) + "px";
    }
    if (pane === "cal") { if (B.ci) B.view = new Date(B.ci.getFullYear(), B.ci.getMonth(), 1); renderCal(); }
    if (pane === "gue") renderGue();
    if (innerWidth <= 760) document.body.style.overflow = "hidden";
  }

  function closeP() {
    openPane = null; pop.classList.remove("open"); back.classList.remove("open"); document.body.style.overflow = "";
    document.querySelectorAll(".bf").forEach(b => b.classList.remove("on"));
    if (B.ci && !B.co && !isDay()) B.co = addD(B.ci, 1);
    updateBar();
  }

  book.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    if (openPane === btn.dataset.open && btn.classList.contains("on")) { closeP(); return; }
    if (btn.dataset.open === "cal") {
      B.picking = (btn.dataset.focus === "out" && B.ci && !isDay()) ? "out" : "in";
    }
    openP(btn.dataset.open, btn);
  }));

  pop.addEventListener("click", e => { e.stopPropagation(); if (e.target.closest("[data-close]")) closeP(); });
  back.addEventListener("click", closeP);
  document.addEventListener("click", e => { if (openPane && !pop.contains(e.target)) closeP(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && openPane) closeP(); });

  const calMonths = document.getElementById("calMonths");
  function monthHTML(y, m) {
    const first = new Date(y, m, 1), n = new Date(y, m + 1, 0).getDate();
    let h = `<div class="cal-m"><h6>${MES[m]} ${y}</h6><div class="cal-g">` + ["D","S","T","Q","Q","S","S"].map(w => `<span class="wd">${w}</span>`).join("");
    for (let i = 0; i < first.getDay(); i++) h += "<span></span>";
    for (let d = 1; d <= n; d++) {
      const dt = new Date(y, m, d), k = key(dt), c = ["d"];
      const dis = dt < TODAY || (B.picking === "out" && B.ci && !isDay() && !B.co && dt < B.ci);
      if (dt.getDay() === 0 || dt.getDay() === 6) c.push("we");
      if (+dt === +TODAY) c.push("today");
      if (FERIADOS[k]) c.push("hol");
      const tip = FERIADOS[k] ? ` title="${FERIADOS[k]}"` : "";
      h += `<button type="button" class="${c.join(" ")}" data-k="${k}"${dis ? " disabled" : ""}${tip} aria-label="${fmtS(dt)}${FERIADOS[k] ? " – " + FERIADOS[k] : ""}"><span>${d}</span></button>`;
    }
    return h + "</div></div>";
  }

  function renderCal() {
    const v = B.view;
    let h = monthHTML(v.getFullYear(), v.getMonth());
    const v2 = new Date(v.getFullYear(), v.getMonth() + 1, 1);
    h += monthHTML(v2.getFullYear(), v2.getMonth());
    calMonths.innerHTML = h;
    paintRange();
    document.getElementById("calPrev").disabled = v <= new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    const st = document.getElementById("calStep"), ti = document.getElementById("calTitle"), info = document.getElementById("calInfo");
    if (isDay()) { st.textContent = "Day use · escolha o dia"; ti.textContent = "Qual dia?"; }
    else if (B.picking === "in") { st.textContent = "Escolha a data de entrada"; ti.textContent = "Quando você chega?"; }
    else { st.textContent = "Agora escolha a saída"; ti.textContent = "E quando vai embora?"; }

    if (isDay()) info.innerHTML = B.ci ? `<b>${fmtS(B.ci)}</b> · das 8h às 17h` : "Selecione um dia";
    else if (B.ci && B.co) { const n = nightsOf(B.ci, B.co); info.innerHTML = `<b>${fmtS(B.ci)}</b> → <b>${fmtS(B.co)}</b> · ${n} diária${n > 1 ? "s" : ""}`; }
    else if (B.ci) info.innerHTML = `Entrada <b>${fmtS(B.ci)}</b> · escolha a saída`;
    else info.textContent = "Selecione a entrada";

    const hols = [...calMonths.querySelectorAll(".d.hol:not([disabled])")].map(b => FERIADOS[b.dataset.k]).filter((v, i, a) => v && a.indexOf(v) === i);
    if (hols.length) info.innerHTML += `<br><span style="color:#D9643A;font-weight:700">● ${hols.join(" · ")}</span>`;
  }

  calMonths.addEventListener("click", e => {
    const b = e.target.closest(".d");
    if (!b || b.disabled) return;
    const [y, m, d] = b.dataset.k.split("-").map(Number), dt = new Date(y, m - 1, d);
    if (isDay()) { B.ci = dt; B.co = dt; renderCal(); setTimeout(closeP, 220); return; }
    if (B.picking === "in" || !B.ci || dt <= B.ci) {
      B.ci = dt; B.co = null; B.picking = "out";
    } else {
      B.co = dt; B.picking = "in"; renderCal(); updateBar(); setTimeout(closeP, 260); return;
    }
    renderCal();
    updateBar();
  });

  calMonths.addEventListener("mouseover", e => {
    if (B.picking !== "out" || B.co || isDay()) return;
    const b = e.target.closest(".d");
    if (!b || b.disabled) return;
    const [y, m, d] = b.dataset.k.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    if (!B.hover || +B.hover !== +dt) { B.hover = dt; paintRange(); }
  });

  calMonths.addEventListener("mouseleave", () => { if (B.hover) { B.hover = null; paintRange(); } });

  function paintRange() {
    const end = isDay() ? B.ci : (B.co || (B.picking === "out" && B.hover) || null);
    calMonths.querySelectorAll(".d").forEach(b => {
      const [y, m, d] = b.dataset.k.split("-").map(Number), dt = new Date(y, m - 1, d);
      const st = B.ci && +dt === +B.ci, en = end && +dt === +end, ir = B.ci && end && dt > B.ci && dt < end;
      b.classList.toggle("st", !!st);
      b.classList.toggle("en", !!en);
      b.classList.toggle("in-r", !!ir);
      b.classList.toggle("prev", !B.co && !isDay() && !!(ir || (en && !st)));
    });
  }

  document.getElementById("calPrev").onclick = () => { B.view = new Date(B.view.getFullYear(), B.view.getMonth() - 1, 1); renderCal(); };
  document.getElementById("calNext").onclick = () => { B.view = new Date(B.view.getFullYear(), B.view.getMonth() + 1, 1); renderCal(); };
  document.getElementById("calClear").onclick = () => { B.ci = null; B.co = null; B.picking = "in"; B.hover = null; renderCal(); updateBar(); };

  function renderGue() {
    document.querySelectorAll(".step").forEach(st => {
      const k = st.dataset.k, v = B[k], [mi, pl] = st.querySelectorAll("button");
      st.querySelector("span").textContent = v;
      mi.disabled = v <= (k === "ad" ? 1 : 0);
      pl.disabled = v >= (k === "ad" ? 12 : 10);
    });
    const ok = isPetOk(), pet = document.getElementById("pet");
    if (!ok) B.pet = false;
    pet.checked = B.pet;
    pet.disabled = !ok;
    document.getElementById("petRow").classList.toggle("off", !ok);
    document.getElementById("petNote").textContent = ok ? `Cães de pequeno porte · R$ ${TAXA_PET}/noite` : `Não aceito em ${hosp.nome}`;
    document.getElementById("gueInfo").innerHTML = `<b>${gueTxt()}</b>`;
  }

  document.querySelectorAll(".step").forEach(st => st.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const k = st.dataset.k;
    B[k] = Math.max(k === "ad" ? 1 : 0, Math.min(k === "ad" ? 12 : 10, B[k] + +b.dataset.d));
    renderGue();
    updateBar();
  }));

  document.getElementById("pet").onchange = e => {
    B.pet = e.target.checked;
    renderGue();
    updateBar();
  };

  const gueTxt = () => `${B.ad} adulto${B.ad > 1 ? "s" : ""}${B.cr ? `, ${B.cr} criança${B.cr > 1 ? "s" : ""}` : ""}${B.pet ? " + pet" : ""}`;

  function updateBar() {
    const inB = document.getElementById("bfIn"), outB = document.getElementById("bfOut");
    if (!inB || !outB) return;
    inB.textContent = B.ci ? fmtS(B.ci) : "Escolher";
    inB.parentElement.parentElement.classList.toggle("empty", !B.ci);
    document.getElementById("bfOutL").textContent = isDay() ? "Horário" : "Saída";
    outB.textContent = isDay() ? "8h às 17h" : (B.co ? fmtS(B.co) : "Escolher");
    outB.parentElement.parentElement.classList.toggle("empty", !isDay() && !B.co);
    document.getElementById("bfGue").textContent = gueTxt();
    const sum = document.getElementById("bsum");
    if (!sum) return;
    if (isGlamping() || !hosp.preco) {
      sum.innerHTML = `<span>☀ O <b>Glamping</b> está chegando — entre na lista de espera e seja avisado primeiro.</span>`;
      return;
    }
    const n = (B.ci && B.co && !isDay()) ? nightsOf(B.ci, B.co) : 0;
    let parts = [];
    if (isDay() && B.ci) parts.push(`<span>Day use em <b>${fmtS(B.ci)}</b></span>`);
    else if (n) parts.push(`<span><b>${n} diária${n > 1 ? "s" : "" }</b> (${fmtS(B.ci)} → ${fmtS(B.co)})</span>`);
    parts.push(`<span>${gueTxt()}</span>`);
    if (hosp.refeicoesInclusas) parts.push(`<span>café + almoço inclusos</span>`);
    let est = "";
    const dias = isDay() ? (B.ci ? 1 : 0) : n;
    if (dias) {
      const v = hosp.preco * B.ad * dias + (B.pet ? TAXA_PET * dias : 0);
      est = `<span class="est">estimativa · ${B.ad} adulto${B.ad > 1 ? "s" : ""}${B.cr ? " (crianças à parte)" : ""}<strong>${brl(v)}</strong></span>`;
    } else {
      est = `<span class="est">a partir de<strong>${brl(hosp.preco)}</strong> por adulto</span>`;
    }
    sum.innerHTML = parts.join("") + est;
  }

  function doSend() {
    const wa = (data.contato && data.contato.whatsapp) || "5511963984355";
    if (isGlamping() || !hosp.preco) {
      window.open(`https://wa.me/${wa}?text=${encodeURIComponent(`Olá! Quero entrar na lista de espera do *${hosp.nome}* do Camping Chapéu de Sol ☀`)}`, "_blank");
      return;
    }
    if (!B.ci || (!isDay() && !B.co)) {
      openP("cal", book.querySelector('[data-open="cal"]'));
      return;
    }
    const n = isDay() ? 0 : nightsOf(B.ci, B.co);
    const linhas = [
      `• Hospedagem: *${hosp.nome}*`,
      isDay() ? `• Dia: ${fmtBR(B.ci)} (${SEM[B.ci.getDay()]})` : `• Entrada: ${fmtBR(B.ci)} (${SEM[B.ci.getDay()]})
• Saída: ${fmtBR(B.co)} (${SEM[B.co.getDay()]})
• ${n} diária${n > 1 ? "s" : ""}`,
      `• Adultos: ${B.ad}`,
      `• Crianças: ${B.cr}`
    ];
    if (B.pet) linhas.push("• Vou levar um pet (cão de pequeno porte) 🐾");
    const msg = `Olá! Quero reservar no Camping Chapéu de Sol ☀\n\n${linhas.join("\n")}

Pode me passar disponibilidade e valor final?`;
    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, "_blank");
  }

  document.getElementById("send").onclick = doSend;
  const tabbarResBtn = document.getElementById("tabbarReservarBtn");
  if (tabbarResBtn) tabbarResBtn.onclick = doSend;

  addEventListener("resize", () => { if (openPane) closeP(); });
  updateBar();
}


// Initial load
async function init() {
  try {
    const res = await fetch('/dados.json');
    siteDados = await res.json();
    
    const slug = normalizeSlug(getSlugFromUrl());
    if (!slug) {
      renderNotFound();
      return;
    }

    const hosp = siteDados.hospedagens.find(item => (item.slug || item.id) === slug);
    if (!hosp) {
      renderNotFound();
      return;
    }

    renderPage(hosp, siteDados);
  } catch (err) {
    console.error('Erro ao carregar dados:', err);
    renderNotFound();
  }
}

init();



/* ===== mobile: pontinhos dos carrosséis nas páginas de hospedagem ===== */
function setupCarouselDotsHosp() {
  document.querySelectorAll(".dots").forEach(d => d.remove());
  document.querySelectorAll(".outras-grid").forEach(t => {
    const items = [...t.children];
    if (items.length < 2) return;
    const d = document.createElement("div");
    d.className = "dots";
    d.innerHTML = items.map(() => "<i></i>").join("");
    t.after(d);
    const upd = () => {
      const first = items[0];
      if (!first) return;
      const w = first.getBoundingClientRect().width + 12;
      const i = Math.round(t.scrollLeft / w);
      d.querySelectorAll("i").forEach((x, j) => x.classList.toggle("on", j === Math.min(i, items.length - 1)));
    };
    t.addEventListener("scroll", upd, { passive: true });
    upd();
  });
}
